<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NovaPad Nexus</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NovaPad Nexus">
  <link rel="apple-touch-icon" href="/icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f0f1a">
  <link rel="manifest" href="/manifest.json">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a3e 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      color: #e0e0e0; padding: 8px;
    }
    .nexus-fab {
      position: fixed; bottom: 24px; right: 24px; width: 64px; height: 64px;
      border-radius: 50%; z-index: 999; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      background: rgba(15, 15, 30, 0.9); backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.6); transition: transform 0.2s ease;
    }
    .nexus-fab::before {
      content: ''; position: absolute; inset: -3px; border-radius: 50%;
      background: conic-gradient(#ff0000, #ff8800, #ffff00, #00ff00, #0088ff, #8800ff, #ff0000);
      animation: rotateRGB 2.5s linear infinite; z-index: -1; filter: blur(3px); opacity: 0.9;
    }
    .nexus-fab.sending::before { animation: rotateRGB 0.8s linear infinite; }
    @keyframes rotateRGB { 100% { transform: rotate(360deg); } }
    .nexus-fab:active { transform: scale(0.9); }
    .nexus-fab.success { animation: successGlow 0.6s ease; }
    @keyframes successGlow {
      0% { box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
      50% { box-shadow: 0 0 40px rgba(76,175,80,0.8); }
      100% { box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
    }
    .nexus-fab.error { animation: shake 0.5s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
    .nexus-fab-inner {
      width: 52px; height: 52px; border-radius: 50%; background: rgba(20, 20, 45, 0.95);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; color: #fff; position: relative; z-index: 1;
    }
    .nexus-fab-inner svg { width: 26px; height: 26px; fill: #fff; filter: drop-shadow(0 0 6px #6c63ff); }
    .container {
      background: rgba(25,25,45,0.8); backdrop-filter: blur(15px);
      padding: 1.2rem 1rem; border-radius: 22px; width: 100%; max-width: 380px;
      box-shadow: 0 20px 35px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 1rem;
    }
    h2 {
      text-align: center; font-weight: 600; letter-spacing: 2px; color: #fff; font-size: 1.5rem;
      text-shadow: 0 0 10px #6c63ff, 0 0 20px #6c63ff;
    }
    .quick-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .quick-btn, .ctrl-btn, .site-btn, .power-btn, .fun-btn, .film-btn, .timer-btn, .clip-btn {
      padding: 10px 4px; border: none; border-radius: 14px;
      background: rgba(35,35,60,0.6); color: #c8c8f0; cursor: pointer;
      transition: 0.15s; text-align: center; font-size: 12px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .quick-btn:active, .ctrl-btn:active, .site-btn:active, .power-btn:active, .fun-btn:active, .film-btn:active, .timer-btn:active, .clip-btn:active { background: #6c63ff; transform: scale(0.95); color: #fff; }
    .film-btn { background: rgba(255,140,0,0.15); color: #ffb74d; }
    .timer-btn { background: rgba(255,200,0,0.15); color: #ffd740; }
    .power-btn { background: rgba(255,70,70,0.2); color: #ff8a8a; font-size:14px; font-weight:600; }
    .fun-btn { background: rgba(0,255,100,0.2); color: #a0ffc0; font-size:14px; font-weight:600; }
    .clip-btn { background: rgba(0,200,255,0.15); color: #80d8ff; }
    .touchpad-container {
      width:100%; background:rgba(20,20,40,0.6); border:1px solid rgba(255,255,255,0.1); border-radius:16px; overflow:hidden;
    }
    .touchpad {
      width:100%; height:100px; background:rgba(30,30,55,0.5); display:flex; align-items:center; justify-content:center;
      color:rgba(255,255,255,0.3); font-size:14px; touch-action:none; user-select:none;
    }
    .touchpad-buttons { display:flex; gap:6px; padding:6px; }
    .touchpad-btn {
      flex:1; padding:8px; border:none; border-radius:12px;
      background:rgba(35,35,60,0.6); color:#c8c8f0; font-size:12px; font-weight:500; cursor:pointer; transition:0.15s;
    }
    .touchpad-btn:active { background:#6c63ff; color:#fff; }
    .search-row { display:flex; gap:6px; }
    .search-row input {
      flex:1; padding:10px 14px; border:none; border-radius:16px;
      background:rgba(45,45,75,0.5); color:white; font-size:14px;
      outline:none; border:1px solid rgba(255,255,255,0.08);
    }
    .search-row input:focus { border-color:#6c63ff; }
    .search-row button {
      padding:10px 16px; border:none; border-radius:16px;
      background:#6c63ff; color:white; font-weight:600; cursor:pointer; font-size:14px;
    }
    .toggle-btn {
      width:100%; padding:10px; border:none; border-radius:16px;
      background:rgba(45,45,75,0.45); color:#eee; font-size:14px; font-weight:500; cursor:pointer;
      animation:rgbPulse 3s ease-in-out infinite alternate; border:2px solid rgba(255,255,255,0.3);
    }
    @keyframes rgbPulse {
      0%{border-color:#ff4d4d;box-shadow:0 0 8px #ff4d4d} 25%{border-color:#ffcc00;box-shadow:0 0 8px #ffcc00}
      50%{border-color:#4dff4d;box-shadow:0 0 8px #4dff4d} 75%{border-color:#4d4dff;box-shadow:0 0 8px #4d4dff}
      100%{border-color:#ff4dff;box-shadow:0 0 8px #ff4dff}
    }
    .collapsible { max-height:0; overflow:hidden; opacity:0; transition:max-height 0.5s ease, opacity 0.3s; }
    .collapsible.open { max-height:1400px; opacity:1; margin-top:0.5rem; }
    .tabs { display:flex; gap:3px; margin-bottom:6px; }
    .tab-btn {
      flex:1; padding:7px 4px; border:none; border-radius:10px;
      background:rgba(35,35,60,0.4); color:#999; font-size:11px; font-weight:500; cursor:pointer; transition:0.2s;
    }
    .tab-btn.active { background:#6c63ff; color:#fff; }
    .tab-content { display:none; }
    .tab-content.active { display:block; }
    .grid-3col, .grid-2col { display:grid; gap:8px; }
    .grid-3col { grid-template-columns:repeat(3,1fr); }
    .grid-2col { grid-template-columns:repeat(2,1fr); }
    .nav-row, .site-row, .power-row, .fun-row, .timer-row, .clip-row { display:flex; gap:6px; margin-top:4px; align-items:center; }
    .nav-row button, .power-row button, .fun-row button, .site-btn { flex:1; }
    .timer-row input, .clip-row input, .clip-row textarea {
      flex:1; padding:8px 10px; border:none; border-radius:12px;
      background:rgba(35,35,60,0.5); color:white; font-size:13px;
      outline:none; border:1px solid rgba(255,255,255,0.08); resize:none;
    }
    .timer-row input:focus, .clip-row input:focus, .clip-row textarea:focus { border-color:#ffc107; }
    .clip-row textarea { height: 80px; font-family: inherit; }
    .timer-display {
      text-align:center; font-size:18px; font-weight:600; color:#ffd740;
      padding:6px; background:rgba(0,0,0,0.3); border-radius:10px;
    }
    .dpad {
      display:grid; grid-template-areas:". up ." "left . right" ". down .";
      grid-template-columns:repeat(3,1fr); gap:8px; justify-items:center; align-items:center;
    }
    .dpad button {
      width:58px; height:58px; border-radius:50%; background:rgba(30,30,55,0.75);
      color:white; font-size:24px; border:1px solid rgba(255,255,255,0.12); cursor:pointer; transition:all 0.15s;
    }
    .dpad button:active { background:#6c63ff; transform:scale(0.85); }
    .dpad .up{grid-area:up} .dpad .down{grid-area:down} .dpad .left{grid-area:left} .dpad .right{grid-area:right}
    #status { text-align:center; font-size:10px; opacity:0.5; color:#9e9eb9; }
    .sens-row { display:flex; align-items:center; gap:6px; padding:4px 6px; }
    .sens-row span { font-size:10px; opacity:0.7; }
    .sens-row input { flex:1; accent-color:#6c63ff; }
  </style>
</head>
<body>
  <div class="nexus-fab" id="nexusFab">
    <div class="nexus-fab-inner"><svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg></div>
  </div>
  <input type="file" id="photoInputFab" accept="image/*" style="display:none;">
  <input type="file" id="fileInputUpload" style="display:none;">

  <div class="container">
    <h2>✦ NOVAPAD NEXUS ✦</h2>
    <div class="touchpad-container">
      <div class="touchpad" id="touchpad">👆 Touchpad</div>
      <div class="touchpad-buttons">
        <button class="touchpad-btn" id="btnLeftClick">👆 Sol</button>
        <button class="touchpad-btn" id="btnRightClick">👆 Sağ</button>
        <button class="touchpad-btn" id="btnDoubleClick">👆 Çift</button>
      </div>
      <div class="sens-row">
        <span>Hassasiyet</span>
        <input type="range" id="sensitivitySlider" min="1" max="5" step="0.5" value="2.5">
        <span id="sensitivityValue">2.5</span>
      </div>
    </div>
    <div class="quick-actions">
      <div class="quick-btn" onclick="emitApp('chrome')">🌐 Chrome</div>
      <div class="quick-btn" onclick="emitApp('spotify')">🟢 Spotify</div>
      <div class="quick-btn" onclick="emitApp('youtubeMusic')">🎵 YT Music</div>
      <div class="quick-btn" onclick="emitApp('youtube')">▶️ YouTube</div>
      <div class="quick-btn" onclick="emitApp('notepad')">📝 Not</div>
      <div class="quick-btn" onclick="emitApp('calc')">🧮 Hesap</div>
      <div class="quick-btn" onclick="emitApp('explorer')">📁 Dosya</div>
      <div class="quick-btn" onclick="emitApp('taskmgr')">⚙️ Görev</div>
    </div>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Google'da ara..." autocomplete="off">
      <button id="sendBtn">⚡</button>
    </div>
    <button class="toggle-btn" id="toggleBtn">🔽 Tüm Kontroller</button>
    <div class="collapsible" id="collapsiblePanel">
      <div class="tabs">
        <button class="tab-btn active" data-tab="tab-controls">🎮 Kontrol</button>
        <button class="tab-btn" data-tab="tab-timer">⏱️ Zamanlayıcı</button>
        <button class="tab-btn" data-tab="tab-clipboard">📋 Pano</button>
        <button class="tab-btn" data-tab="tab-sites">🍿 Hızlı Siteler</button>
        <button class="tab-btn" data-tab="tab-fun">🌀 Eğlence</button>
      </div>
      <div class="tab-content active" id="tab-controls">
        <div class="grid-3col" id="shortcutsContainer"></div>
        <div class="nav-row">
          <button id="btnTab">↹ Tab</button>
          <button id="btnShiftTab">⇧↹</button>
          <button id="btnEnter">↵ Enter</button>
        </div>
        <div class="site-row">
          <button class="site-btn" id="btnFileUpload">📂 Dosya Gönder</button>
          <button class="site-btn" id="btnCleanStorage">🧹 Temizlik</button>
        </div>
        <div class="power-row">
          <button class="power-btn" id="btnMonitorOff">💤 Ekran Kapat</button>
          <button class="power-btn" id="btnMinimizeAll">🖥️ Masaüstü</button>
        </div>
        <div class="power-row">
          <button class="power-btn" id="btnLock">🔒 Kilitle</button>
          <button class="power-btn" onclick="emitApp('snipping')">✂️ Kesit</button>
        </div>
        <div class="power-row">
          <button class="power-btn" id="btnShutdown">⏻ Kapat</button>
          <button class="power-btn" id="btnRestart">🔄 Yeniden Başlat</button>
        </div>
      </div>
      <div class="tab-content" id="tab-timer">
        <div class="timer-row">
          <input type="number" id="timerInput" placeholder="Dakika girin..." min="1" max="480">
          <button class="timer-btn" id="btnTimerStart"><span>⏱️</span>Başlat</button>
        </div>
        <div class="timer-row"><div class="timer-display" id="timerDisplay">⏳ Henüz başlamadı</div></div>
        <div class="timer-row"><button class="timer-btn" id="btnTimerCancel"><span>❌</span>İptal Et</button></div>
      </div>
      <!-- 📋 PANO SEKMESİ -->
      <div class="tab-content" id="tab-clipboard">
        <div class="clip-row">
          <textarea id="clipboardText" placeholder="Bilgisayar panosuna gönderilecek metin..."></textarea>
        </div>
        <div class="clip-row">
          <button class="clip-btn" id="btnSendClipboard"><span>📤</span>PC'ye Gönder</button>
          <button class="clip-btn" id="btnReadClipboard"><span>📥</span>PC'den Al</button>
        </div>
        <div class="clip-row" style="margin-top:8px;">
          <button class="clip-btn" id="btnCopyToPhone"><span>📋</span>Telefona Kopyala</button>
        </div>
        <div class="clip-row" style="margin-top:8px;">
          <div style="flex:1; padding:8px 10px; border-radius:12px; background:rgba(0,0,0,0.3); color:#80d8ff; font-size:12px; min-height:40px;" id="clipboardStatus">📋 Pano hazır...</div>
        </div>
      </div>
      <div class="tab-content" id="tab-sites">
        <div class="grid-2col">
          <button class="film-btn" onclick="emitApp('https://netflix.com')"><span>🎬</span>Netflix</button>
          <button class="film-btn" onclick="emitApp('https://www.fullhdfilmizlesene.life/')"><span>📽️</span>Tr Dublaj Film İzle</button>
          <button class="film-btn" onclick="emitApp('https://www.hdfilmcehennemi.nl/')"><span>🎞️</span>hdfilmcehennemi</button>
          <button class="film-btn" onclick="emitApp('https://disneyplus.com')"><span>🏰</span>Disney+</button>
          <button class="film-btn" onclick="emitApp('https://blutv.com')"><span>👤</span>BluTV</button>
          <button class="film-btn" onclick="emitApp('https://exxen.com')"><span>🐦‍🔥</span>Exxen</button>
          <button class="film-btn" onclick="emitApp('https://notube.net/tr/youtube-app-351')"><span>Ⓜ️</span>Mp4 dönüştürücü</button>
          <button class="film-btn" onclick="emitApp('https://twitch.tv')"><span>😶‍🌫️</span>Twitch</button>
          <button class="film-btn" onclick="emitApp('https://kick.com/')"><span>🎙️</span>Kick</button>
        </div>
        <div class="site-row" style="margin-top:8px;">
          <button class="site-btn" id="btnGmail">📧 Gmail</button>
          <button class="site-btn" id="btnWhatsapp">💬 WhatsApp</button>
        </div>
        <div class="site-row">
          <button class="site-btn" id="btnGithub">🐙 GitHub</button>
          <button class="site-btn" onclick="emitApp('control')">🛠️ Panel</button>
        </div>
      </div>
      <div class="tab-content" id="tab-fun">
        <div class="fun-row">
          <button class="fun-btn" id="btnMatrix">🟢 Matrix</button>
          <button class="fun-btn" id="btnMouseCrazy">🖱️ Fare Çılgın</button>
        </div>
        <div class="fun-row">
          <button class="fun-btn" id="btnScreenFlip">🖥️ Ekranı Ters Çevir</button>
          <button class="fun-btn" id="btnScreenNormal">🖥️ Ekranı Düzelt</button>
        </div>
      </div>
    </div>
    <div class="dpad">
      <button class="up" id="btnUp">▲</button>
      <button class="left" id="btnLeft">◀</button>
      <button class="right" id="btnRight">▶</button>
      <button class="down" id="btnDown">▼</button>
    </div>
    <div style="text-align:center;margin-top:0.5rem;opacity:0.7;">
      <svg width="180" height="60" viewBox="0 0 300 80"><style>.sig{fill:#b7b7f0;font-family:'Brush Script MT',cursive;font-size:42px;filter:drop-shadow(0 0 6px #6c63ff)}</style><text x="20" y="55" class="sig">Hasan Uyar</text></svg>
    </div>
    <div id="status">● Bağlanıyor</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const statusDiv = document.getElementById('status');
    let sens = 2.5;

    // ========== TOUCHPAD ==========
    const tp = document.getElementById('touchpad');
    let lx=0, ly=0, touching=false;
    const sSlider = document.getElementById('sensitivitySlider');
    const sVal = document.getElementById('sensitivityValue');
    sSlider.addEventListener('input', () => { sens=+sSlider.value; sVal.textContent=sens.toFixed(1); });
    tp.addEventListener('touchstart', e => {
      e.preventDefault();
      const t = e.touches[0]; lx=t.clientX; ly=t.clientY; touching=true;
    });
    tp.addEventListener('touchmove', e => {
      e.preventDefault();
      if(!touching) return;
      const t = e.touches[0];
      const dx = Math.round((t.clientX-lx)*sens);
      const dy = Math.round((t.clientY-ly)*sens);
      if(dx!==0 || dy!==0) socket.emit('mouseMove',{dx,dy});
      lx=t.clientX; ly=t.clientY;
    });
    tp.addEventListener('touchend', e => { e.preventDefault(); touching=false; });
    document.getElementById('btnLeftClick').addEventListener('click',()=>socket.emit('mouseClick'));
    document.getElementById('btnRightClick').addEventListener('click',()=>socket.emit('mouseRightClick'));
    document.getElementById('btnDoubleClick').addEventListener('click',()=>socket.emit('mouseDoubleClick'));

    window.emitApp = (app) => socket.emit('key', app);

    // ========== 📋 PANO ==========
    const clipboardText = document.getElementById('clipboardText');
    const clipboardStatus = document.getElementById('clipboardStatus');

    document.getElementById('btnSendClipboard').addEventListener('click', () => {
      const text = clipboardText.value.trim();
      if (text) { socket.emit('clipboard', text); clipboardStatus.textContent = '📤 PC panosuna gönderildi!'; }
    });

    document.getElementById('btnReadClipboard').addEventListener('click', () => {
      socket.emit('readClipboard'); clipboardStatus.textContent = '📥 PC panosu okunuyor...';
    });

    document.getElementById('btnCopyToPhone').addEventListener('click', () => {
      const text = clipboardText.value.trim();
      if (!text) return;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
          clipboardStatus.textContent = '✅ Telefon panosuna kopyalandı!';
        }).catch(() => fallbackCopy(text));
      } else { fallbackCopy(text); }
      function fallbackCopy(t) {
        const ta = document.createElement('textarea');
        ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.focus(); ta.select();
        try { document.execCommand('copy'); clipboardStatus.textContent = '✅ Telefon panosuna kopyalandı!'; }
        catch (e) { clipboardText.select(); clipboardText.focus(); clipboardStatus.textContent = '⚠️ Otomatik kopyalanamadı, lütfen metni seçip kopyalayın'; }
        document.body.removeChild(ta);
      }
    });

    socket.on('clipboardContent', (text) => {
      if (text) { clipboardText.value = text; clipboardStatus.textContent = '📥 PC panosu alındı! (' + text.length + ' karakter)'; }
      else { clipboardStatus.textContent = '📋 PC panosu boş'; }
    });
    socket.on('clipboardDone', (text) => { clipboardStatus.textContent = '✅ PC panosuna yazıldı! (' + text.length + ' karakter)'; });
    socket.on('clipboardError', () => { clipboardStatus.textContent = '❌ Pano hatası'; });

    // ========== KISAYOLLAR ==========
    const sc = document.getElementById('shortcutsContainer');
    [{k:'ctrl+t',i:'🆕',l:'Sekme'},{k:'ctrl+w',i:'❌',l:'Kapat'},{k:'alt+left',i:'⬅️',l:'Geri'},{k:'alt+right',i:'➡️',l:'İleri'},{k:'volume_up',i:'🔊',l:'Ses +'},{k:'volume_down',i:'🔉',l:'Ses -'},{k:'volume_mute',i:'🔇',l:'Sustur'},{k:'media_play_pause',i:'⏯️',l:'Oynat'},{k:'media_prev',i:'⏮️',l:'Önceki'},{k:'media_next',i:'⏭️',l:'Sonraki'},{k:'escape',i:'⎋',l:'Esc'}].forEach(s=>{
      const b=document.createElement('button'); b.className='ctrl-btn'; b.innerHTML=`<span>${s.i}</span>${s.l}`;
      b.addEventListener('click',()=>socket.emit('key',s.k)); sc.appendChild(b);
    });

    // ========== SEKMELER ==========
    document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>{
      document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); document.getElementById(b.dataset.tab).classList.add('active');
    }));

    // ========== PANEL AÇ/KAPAT ==========
    document.getElementById('toggleBtn').addEventListener('click',()=>{
      const p=document.getElementById('collapsiblePanel');
      const o=p.classList.toggle('open');
      document.getElementById('toggleBtn').innerHTML = o ? '🔼 Kapat' : '🔽 Tüm Kontroller';
    });

    // ========== BUTONLAR ==========
    document.getElementById('btnTab').addEventListener('click',()=>socket.emit('key','tab'));
    document.getElementById('btnShiftTab').addEventListener('click',()=>socket.emit('key','shiftTab'));
    document.getElementById('btnEnter').addEventListener('click',()=>socket.emit('key','enter'));
    document.getElementById('btnGmail').addEventListener('click',()=>socket.emit('key','gmail'));
    document.getElementById('btnWhatsapp').addEventListener('click',()=>socket.emit('key','whatsapp'));
    document.getElementById('btnGithub').addEventListener('click',()=>socket.emit('key','github'));
    document.getElementById('btnMinimizeAll').addEventListener('click',()=>socket.emit('key','minimizeAll'));
    document.getElementById('btnLock').addEventListener('click',()=>socket.emit('key','lock'));
    document.getElementById('btnMonitorOff').addEventListener('click',()=>socket.emit('key','monitorOff'));
    document.getElementById('btnMatrix').addEventListener('click',()=>{socket.emit('key','matrix');statusDiv.textContent='🟢 Matrix başladı!';});
    document.getElementById('btnMouseCrazy').addEventListener('click',()=>{socket.emit('key','mouseCrazy');statusDiv.textContent='🖱️ Fare çıldırdı!';});
    document.getElementById('btnScreenFlip').addEventListener('click',()=>{socket.emit('key','screenFlip');statusDiv.textContent='🖥️ Ekran ters döndü!';});
    document.getElementById('btnScreenNormal').addEventListener('click',()=>{socket.emit('key','screenNormal');statusDiv.textContent='🖥️ Ekran düzeldi!';});
    document.getElementById('btnShutdown').addEventListener('click',()=>{if(confirm('Kapatılsın mı?')){socket.emit('key','shutdown');statusDiv.textContent='⏻ Kapatılıyor...';}});
    document.getElementById('btnRestart').addEventListener('click',()=>{if(confirm('Yeniden başlatılsın mı?')){socket.emit('key','restart');statusDiv.textContent='🔄 Yeniden başlatılıyor...';}});

    // ========== DOSYA & TEMİZLİK ==========
    const fu = document.getElementById('fileInputUpload');
    document.getElementById('btnFileUpload').addEventListener('click',()=>fu.click());
    fu.addEventListener('change',e=>{
      const f=e.target.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=ev=>{socket.emit('fileUpload',{name:f.name,data:ev.target.result});statusDiv.textContent='📂 Gönderiliyor...';};
      r.readAsDataURL(f);
    });
    socket.on('fileSent',n=>{statusDiv.textContent=`✅ "${n}" kaydedildi!`;});
    socket.on('fileError',()=>{statusDiv.textContent='❌ Hata';});
    document.getElementById('btnCleanStorage').addEventListener('click',()=>{
      if(confirm('Temizlik yapılsın mı?')){socket.emit('cleanStorage');statusDiv.textContent='🧹 Temizleniyor...';}
    });
    socket.on('storageCleaned',()=>{statusDiv.textContent='✅ Temizlendi!';});
    socket.on('cleanError',()=>{statusDiv.textContent='❌ Temizlik hatası';});

    // ========== ZAMANLAYICI ==========
    let timerInt=null, remaining=0;
    document.getElementById('btnTimerStart').addEventListener('click',()=>{
      const m=+document.getElementById('timerInput').value;
      if(!m||m<=0){statusDiv.textContent='⚠️ Geçerli dakika girin';return;}
      if(timerInt) clearInterval(timerInt);
      socket.emit('timerShutdown',m);
    });
    document.getElementById('btnTimerCancel').addEventListener('click',()=>socket.emit('cancelShutdown'));
    socket.on('timerStarted',m=>{
      remaining=m*60; statusDiv.textContent=`⏱️ ${m} dakika sonra kapanacak`; updTimer();
      if(timerInt) clearInterval(timerInt);
      timerInt=setInterval(()=>{remaining--;updTimer();if(remaining<=0){clearInterval(timerInt);timerInt=null;document.getElementById('timerDisplay').textContent='⏻ Kapatılıyor...';}},1000);
    });
    socket.on('timerError',()=>{statusDiv.textContent='❌ Başlatılamadı';});
    socket.on('shutdownCancelled',()=>{
      if(timerInt) clearInterval(timerInt); timerInt=null; remaining=0;
      document.getElementById('timerDisplay').textContent='⏳ İptal edildi'; statusDiv.textContent='✅ Kapatma iptal';
    });
    socket.on('cancelError',()=>{statusDiv.textContent='❌ İptal edilemedi';});
    function updTimer(){
      const m=Math.floor(remaining/60), s=remaining%60;
      document.getElementById('timerDisplay').textContent=`⏳ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} kaldı`;
    }

    // ========== RGB DAİRE ==========
    const fab=document.getElementById('nexusFab'), pf=document.getElementById('photoInputFab');
    let pt=null, lp=false;
    fab.addEventListener('touchstart',e=>{e.preventDefault();lp=false;pt=setTimeout(()=>{lp=true;pf.click();},500);});
    fab.addEventListener('touchend',e=>{e.preventDefault();clearTimeout(pt);if(!lp){const p=document.getElementById('collapsiblePanel');const tb=document.getElementById('toggleBtn');const o=p.classList.toggle('open');tb.innerHTML=o?'🔼 Kapat':'🔽 Tüm Kontroller';if(o)p.scrollIntoView({behavior:'smooth',block:'center'});}});
    fab.addEventListener('mousedown',()=>{lp=false;pt=setTimeout(()=>{lp=true;pf.click();},500);});
    fab.addEventListener('mouseup',()=>{clearTimeout(pt);if(!lp){const p=document.getElementById('collapsiblePanel');const tb=document.getElementById('toggleBtn');const o=p.classList.toggle('open');tb.innerHTML=o?'🔼 Kapat':'🔽 Tüm Kontroller';if(o)p.scrollIntoView({behavior:'smooth',block:'center'});}});
    pf.addEventListener('change',e=>{
      const f=e.target.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=ev=>{fab.classList.add('sending');socket.emit('photo',ev.target.result);
        socket.once('photoSent',()=>{fab.classList.remove('sending');fab.classList.add('success');statusDiv.textContent='✅ Açıldı!';setTimeout(()=>fab.classList.remove('success'),2000);});
        socket.once('photoError',()=>{fab.classList.remove('sending');fab.classList.add('error');statusDiv.textContent='❌ Hata!';setTimeout(()=>fab.classList.remove('error'),2000);});
      };
      r.readAsDataURL(f);
    });

    // ========== YÖN TUŞLARI ==========
    document.getElementById('btnUp').addEventListener('click',()=>socket.emit('key','up'));
    document.getElementById('btnDown').addEventListener('click',()=>socket.emit('key','down'));
    document.getElementById('btnLeft').addEventListener('click',()=>socket.emit('key','left'));
    document.getElementById('btnRight').addEventListener('click',()=>socket.emit('key','right'));

    socket.on('connect',()=>{statusDiv.textContent='✅ Bağlı';});
    socket.on('disconnect',()=>{statusDiv.textContent='⛔ Bağlantı koptu';});

    // ========== ARAMA ==========
    document.getElementById('sendBtn').addEventListener('click',()=>{
      const t=document.getElementById('searchInput').value.trim();
      if(t){socket.emit('type',t);document.getElementById('searchInput').value='';}
    });
    document.getElementById('searchInput').addEventListener('keypress',e=>{if(e.key==='Enter'){document.getElementById('sendBtn').click();}});
  </script>
</body>
</html>
